name: Gold Spot alerts

on:
  workflow_dispatch:
  schedule:
    # 08:45 Thailand time, Monday-Saturday (15 minutes after Index alerts)
    - cron: "45 1 * * 1-6"

permissions:
  contents: write

concurrency:
  group: gold-spot-alerts
  cancel-in-progress: false

jobs:
  check-gold-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Gold Spot alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python scripts/run_gold_spot_alert.py

      - name: Save Gold Spot history
        if: success()
        run: |
          if [[ -n "$(git status --porcelain data/gold_spot_history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gold_spot_history.json
            git commit -m "Update Gold Spot alert history"
            git push
          else
            echo "Gold Spot history unchanged."
          fi
