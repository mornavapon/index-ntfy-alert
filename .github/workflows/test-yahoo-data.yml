
name: Index alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-6"

permissions:
  contents: write

concurrency:
  group: index-alerts
  cancel-in-progress: false

jobs:
  check-index-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test ntfy mobile notification
        if: github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          token = os.environ.get("NTFY_TOKEN", "").strip()

          if not topic:
              raise SystemExit("ERROR: Missing NTFY_TOPIC secret.")

          headers = {
              "Title": "Index Alert Test",
              "Tags": "white_check_mark",
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          message = (
              "แจ้งเตือนบนมือถือได้แล้ว! ระบบ Index Alert เชื่อมต่อ ntfy สำเร็จ "
              f"เวลา {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\n"
              "กำลังตรวจสอบข้อมูลดัชนีหุ้น หากไม่มีข้อความอื่น "
              "อาจหมายถึงยังไม่มีเงื่อนไขแจ้งเตือน"
          )

          response = requests.post(
              f"https://ntfy.sh/{topic}",
              data=message.encode("utf-8"),
              headers=headers,
              timeout=20,
          )
          response.raise_for_status()
          print("PASS: ntfy accepted the test notification.")
          PY

      - name: Run index alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python scripts/run_index_alerts.py

      - name: Save alert state
        if: success()
        run: |
          if [[ -n "$(git status --porcelain data/alert_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/alert_state.json
            git commit -m "Update index alert state"
            git push
          else
            echo "Alert state unchanged."
          fi
