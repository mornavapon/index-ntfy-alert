name: Test Yahoo Finance index data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-6"

permissions:
  contents: read

concurrency:
  group: yahoo-index-data-probe
  cancel-in-progress: true

jobs:
  check-index-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check index data
        run: python scripts/test_yahoo_indices.py
